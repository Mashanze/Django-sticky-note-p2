{% extends 'base.html' %}
{% block content %}
<h2>All Notes</h2>
<a href="{% url 'note_create' %}">+ Create New Note</a>
<ul>
    {% for note in notes %}
        <li><a href="{% url 'note_detail' pk=note.pk %}">{{ note.title }}</a></li>
    {% empty %}
        <p>No sticky notes found.</p>
    {% endfor %}
</ul>
{% endblock %}
