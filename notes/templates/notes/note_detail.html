{% extends 'base.html' %}
{% block content %}
<h2>{{ note.title }}</h2>
<p>{{ note.content }}</p>
<p><small>Created at: {{ note.created_at }}</small></p>
<br>
<a href="{% url 'note_update' pk=note.pk %}">Edit</a> | 
<a href="{% url 'note_delete' pk=note.pk %}">Delete</a> | 
<a href="{% url 'note_list' %}">Back to list</a>
{% endblock %}
